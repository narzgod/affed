<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poster Studio</title>
<style>
:root{--bg:#0c0d0f;--pn:#16191d;--ln:#2a2f36;--tx:#eceef0;--mu:#8d96a0;--ac:#c8102e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#stage{position:sticky;top:0;z-index:5;background:#050506;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;text-align:center;border-bottom:1px solid var(--ln)}
canvas{height:40vh;width:auto;max-width:100%;aspect-ratio:4/5;touch-action:none;border-radius:4px}
#hint{color:var(--mu);font-size:12px;margin-top:4px}
nav{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto}
nav button{flex:1;min-width:76px;min-height:44px;background:var(--pn);color:var(--mu);border:1px solid var(--ln);border-radius:8px;font-weight:700;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.p{display:none;padding:10px}.p.on{display:block}
.card{background:var(--pn);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}
input[type=text],select,textarea{width:100%;min-height:44px;background:#0c0d0f;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:0 10px;font-size:15px}
input[type=range]{width:100%;accent-color:var(--ac);height:32px}
input[type=color]{width:44px;height:44px;flex:none;border:1px solid var(--ln);border-radius:8px;background:none;padding:2px}
.cf{display:flex;gap:8px;align-items:center}
.cf .hx{flex:1;min-width:0;font-family:ui-monospace,monospace;text-transform:lowercase}
.bad{border-color:#ff6b7f!important}
.btn{min-height:44px;padding:0 14px;background:#22272d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ac{background:var(--ac);border-color:var(--ac);width:100%}
.btn.sel{background:var(--ac);border-color:var(--ac)}
.btn.x{color:#ff6b7f}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .cf{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .btn{padding:0 4px;font-size:13px}
.thumb{width:56px;height:56px;flex:none;border-radius:8px;background:#0c0d0f center/contain no-repeat;border:1px solid var(--ln)}
small{color:var(--mu)}
.dp{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:10px 0}
.dp button{height:54px;font-size:20px;background:#22272d;color:var(--tx);border:1px solid var(--ln);border-radius:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dp button:active{background:var(--ac)}
.pthumb{display:block;width:100%;height:70px;background:#0c0d0f center/contain no-repeat;border-radius:6px;margin-bottom:4px}
textarea{padding:10px;min-height:76px;font-family:inherit;resize:vertical}
</style></head><body>
<div id="stage"><canvas id="c" width="1080" height="1350"></canvas><div id="hint"></div></div>
<nav id="tabs"></nav>
<div id="panels"></div>
<script src="/owner/tools/combo.js"></script>

 const K=(c.getTransform?c.getTransform().a:1)||1,dd=(sh.d==null?100:sh.d)/100,col=nh(sh.col)||'#000000',reps=sh.k>100?2:1,f=sh.k>100?1:sh.k/100,far=6000;
 const pass=(bl,ox,oy,al)=>{c.save();c.shadowColor=rgba(col,Math.min(1,al*f));c.shadowBlur=bl*K;c.shadowOffsetX=(far+ox)*K;c.shadowOffsetY=oy*K;c.fillStyle='#000';for(let i=0;i<reps;i++)c.fillText(s,x-far,y);c.restore()};
 if(sh.st=='soft'){pass(z*.16,0,z*.04*dd,.55);pass(z*.06,0,z*.018*dd,.55);pass(z*.015,0,z*.007*dd,.6)}
 else if(sh.st=='deep'){pass(z*.07,z*.045*dd,z*.06*dd,.75);pass(z*.02,z*.012*dd,z*.016*dd,.8)}
 else if(sh.st=='halo'){pass(z*.2,0,0,.75);pass(z*.08,0,0,.75);pass(z*.025,0,0,.6)}
 else if(sh.st=='extrude'){const n=Math.max(1,Math.round(z*.05*dd));c.save();c.fillStyle=col;for(let i=n;i>=1;i--)c.fillText(s,x+i*.7071,y+i*.7071);c.restore();pass(z*.1,n*.7071,n*.7071+z*.02,.5)}}

 const L=defs.map(([s,f,z,sp,col])=>{s=String(s).toUpperCase();setF(c,f,z,sp);let vis=c.measureText(s).width-sp;
  if(vis>maxW&&vis>0){const r=maxW/vis;z*=r;sp*=r;vis=maxW}return{s,f,z,sp,col,vis,ch:z*.72}});
 if(!L.length)return null;

 let y=top;L.forEach((l,i)=>{y+=l.ch;l.y=y;y+=x.gap});

function poleLayout(c){const out=[],Z=Q();

  const fl=k=='info'?resolveFlag(lines):null;
  const fn=i=>i?(it.f2||it.f):it.f;let z=it.z,sp=it.sp;const maxW=W-2*it.m;
  const fg=()=>{if(!fl)return{ex:0,fw:0,fh:0};let rt=1.5;if(fl.id)rt=FLAGS[fl.id].w/FLAGS[fl.id].h;else{const i=img(fl.src);if(i)rt=i.naturalWidth/i.naturalHeight}
   const fh=z*.9*Z.flag.fz/100,fw=fh*rt;return{ex:fw+z*.55,fw,fh}};
  const widths=()=>lines.map((s,i)=>{setF(c,fn(i),z,sp);return c.measureText(s).width-sp+(fl&&i==fl.li?fg().ex:0)});
  let ws=widths(),bw=Math.max(...ws);if(bw>maxW&&bw>0){const r=maxW/bw;z*=r;sp*=r;ws=widths();bw=Math.max(...ws)}
  const ch=z*.72,hb=lines.length*ch+(lines.length-1)*it.gap,v=it.pos[0],h=it.pos[1];

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function drawPole(c){c.textBaseline='alphabetic';c.textAlign='left';
